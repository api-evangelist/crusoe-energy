openapi: 3.2.0
info:
  description: The API Gateway exposes all publicly available API endpoints for Crusoe Cloud products.
  title: Crusoe Cloud API Gateway Audit Logs Roles API
  version: v1alpha5
servers:
- url: https://api.crusoecloud.com/v1alpha5
tags:
- name: Roles
paths:
  /iam/role-bindings:
    get:
      tags:
      - Roles
      summary: Lists role bindings visible to the caller.
      operationId: listRoleBindings
      parameters:
      - x-go-name: UserID
        name: user_id
        in: query
        schema:
          type: string
      - x-go-name: RoleID
        name: role_id
        in: query
        schema:
          type: string
      - x-go-name: ScopeType
        name: scope_type
        in: query
        schema:
          type: string
          enum:
          - org
          - project
      - x-go-name: ScopeObjectID
        name: scope_object_id
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/listRoleBindingsResponse'
        '400':
          $ref: '#/components/responses/badReqError'
        '403':
          $ref: '#/components/responses/permissionsError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/serverError'
  /iam/roles:
    get:
      tags:
      - Roles
      summary: Lists role associated with the caller's organization.
      operationId: listRoles
      responses:
        '200':
          $ref: '#/components/responses/listRolesResponse'
        '400':
          $ref: '#/components/responses/badReqError'
        '403':
          $ref: '#/components/responses/permissionsError'
        '500':
          $ref: '#/components/responses/serverError'
  /iam/users/{user_id}/role-bindings:
    post:
      description: If any creation or deletion fails, no changes are applied.
      tags:
      - Roles
      summary: Creates and deletes role bindings for a user in a single atomic operation.
      operationId: applyRoleBindings
      parameters:
      - example: ab4a6b00-aa5f-408e-a9fb-ac6de5eb45ab
        x-go-name: UserID
        name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/emptyResponse'
        '400':
          $ref: '#/components/responses/badReqError'
        '403':
          $ref: '#/components/responses/permissionsError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '500':
          $ref: '#/components/responses/serverError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRoleBindingRequest'
        required: true
components:
  schemas:
    ApplyRoleBindingRequest:
      type: object
      required:
      - bindings_to_create
      - bindings_to_delete
      properties:
        bindings_to_create:
          type: array
          items:
            $ref: '#/components/schemas/RoleBindingInput'
          x-go-name: BindingsToCreate
        bindings_to_delete:
          type: array
          items:
            type: string
          x-go-name: BindingsToDelete
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/handlers
    ListRolesResponse:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          x-go-name: Roles
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/handlers
    Role:
      type: object
      required:
      - id
      - role_name
      - allowed_scopes
      - org_id
      - description
      properties:
        allowed_scopes:
          type: array
          items:
            type: string
          x-go-name: AllowedScopes
        description:
          type: string
          x-go-name: Description
        id:
          type: string
          x-go-name: ID
        org_id:
          type: string
          x-go-name: OrgID
        role_name:
          type: string
          x-go-name: RoleName
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/handlers
    ListRoleBindingsResponse:
      type: object
      required:
      - role_bindings
      properties:
        role_bindings:
          type: array
          items:
            $ref: '#/components/schemas/RoleBinding'
          x-go-name: RoleBindings
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/handlers
    RoleBindingInput:
      type: object
      required:
      - customer_id
      - role_id
      - scope_type
      - scope_object_id
      properties:
        customer_id:
          type: string
          x-go-name: CustomerID
        role_id:
          type: string
          x-go-name: RoleID
        scope_object_id:
          type: string
          x-go-name: ScopeObjectID
        scope_type:
          type: string
          enum:
          - org
          - project
          x-go-name: ScopeType
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/handlers
    RoleBinding:
      type: object
      required:
      - id
      - customer_id
      - role_id
      - scope_type
      - scope_object_id
      - role_name
      properties:
        customer_id:
          type: string
          x-go-name: CustomerID
        id:
          type: string
          x-go-name: ID
        role_id:
          type: string
          x-go-name: RoleID
        role_name:
          type: string
          x-go-name: RoleName
        scope_object_id:
          type: string
          x-go-name: ScopeObjectID
        scope_type:
          type: string
          x-go-name: ScopeType
      x-go-package: gitlab.com/crusoeenergy/island/rest-gateway/internal/handlers
  responses:
    emptyResponse:
      description: Empty Response
    notFoundError:
      description: Error Not Found
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                x-go-name: Code
                example: '404'
              message:
                type: string
                x-go-name: Message
                example: not_found
    badReqError:
      description: Error Bad Request
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                x-go-name: Code
                example: '400'
              message:
                type: string
                x-go-name: Message
                example: bad_request
    listRoleBindingsResponse:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListRoleBindingsResponse'
    permissionsError:
      description: Error Permissions
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                x-go-name: Code
                example: '403'
              message:
                type: string
                x-go-name: Message
                example: unauthorized
    listRolesResponse:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListRolesResponse'
    serverError:
      description: Error Internal Server
      content:
        application/json:
          schema:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                x-go-name: Code
                example: '500'
              message:
                type: string
                x-go-name: Message
                example: internal_error
x-tagGroups:
- name: Compute
  tags:
  - VMs
  - VM Operations
  - Images
  - Instance Templates
  - Custom Images
  - Custom Image Operations
- name: Organizations
  tags:
  - Projects
  - Entities
  - Prospects
  - Billing
  - Usage
  - Quotas
  - Audit Logs
  - Reservations
- name: Users
  tags:
  - Identities
  - Roles
  - SSH Keys
  - Tokens
- name: Storage
  tags:
  - Disks
  - Disk Operations
  - Snapshots
  - Snapshot Operations
- name: Networking
  tags:
  - VPC Firewall Rules
  - VPC Firewall Rule Operations
  - VPC Networks
  - VPC Subnets
  - IB Partitions
  - Load Balancers
- name: Orchestration
  tags:
